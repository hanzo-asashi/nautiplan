name: Generate Changelog

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  changelog:
    name: Generate Changelog
    if: "!contains(github.event.head_commit.message, 'skip ci')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Changelog from Commits
        id: commits_changelog
        run: |
          # Get previous tag or first commit if no tags
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -z "$PREV_TAG" ]; then
            COMMITS=$(git log --pretty=format:"- %s (%h)" HEAD)
          else
            COMMITS=$(git log --pretty=format:"- %s (%h)" ${PREV_TAG}..HEAD)
          fi

          # Categorize commits
          FEATURES=$(echo "$COMMITS" | grep -i "^- feat" || true)
          FIXES=$(echo "$COMMITS" | grep -i "^- fix" || true)
          DOCS=$(echo "$COMMITS" | grep -i "^- docs" || true)
          TESTS=$(echo "$COMMITS" | grep -i "^- test" || true)
          STYLE=$(echo "$COMMITS" | grep -iE "^- (style|ui|design)" || true)
          CHORE=$(echo "$COMMITS" | grep -iE "^- (chore|refactor|build|ci)" || true)
          OTHER=$(echo "$COMMITS" | grep -ivE "^- (feat|fix|docs|test|style|ui|design|chore|refactor|build|ci)" || true)

          CHANGELOG="## Release Update ($(date +'%Y-%m-%d'))\n\n"

          if [ -n "$FEATURES" ]; then
            CHANGELOG="${CHANGELOG}### 🚀 Features\n${FEATURES}\n\n"
          fi
          if [ -n "$FIXES" ]; then
            CHANGELOG="${CHANGELOG}### 🐛 Bug Fixes\n${FIXES}\n\n"
          fi
          if [ -n "$STYLE" ]; then
            CHANGELOG="${CHANGELOG}### 🎨 UI/UX\n${STYLE}\n\n"
          fi
          if [ -n "$DOCS" ]; then
            CHANGELOG="${CHANGELOG}### 📝 Documentation\n${DOCS}\n\n"
          fi
          if [ -n "$TESTS" ]; then
            CHANGELOG="${CHANGELOG}### 🧪 Tests\n${TESTS}\n\n"
          fi
          if [ -n "$CHORE" ]; then
            CHANGELOG="${CHANGELOG}### 🔧 Maintenance\n${CHORE}\n\n"
          fi
          if [ -n "$OTHER" ]; then
            CHANGELOG="${CHANGELOG}### 📦 Other\n${OTHER}\n\n"
          fi

          # Append to existing CHANGELOG.md
          if [ -f "CHANGELOG.md" ]; then
            echo -e "$CHANGELOG$(cat CHANGELOG.md)" > CHANGELOG.md
          else
            echo -e "$CHANGELOG" > CHANGELOG.md
          fi

      - name: Commit and Push CHANGELOG
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update changelog [skip ci]"
          file_pattern: CHANGELOG.md
